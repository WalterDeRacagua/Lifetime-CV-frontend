<section class="experiences" appScrollReveal>
  <div class="flex justify-content-between align-items-center mb-4">
    <h2 class="section-title">Experiencia Reciente</h2>
    <a routerLink="/experiences" class="section-link">Ver todas →</a>
  </div>
  <div class="grid">
    <div class="col-12">
      <p-card>
        <ng-template #header>
          <div class="flex justify-content-between align-items-center p-3 bg-gray-50">
            <i class="pi pi-briefcase"></i>
            <span class="text-sm text-600">2022 - Presente</span>
          </div>
        </ng-template>
        <h3 class="card-title">Junior Developer</h3>
        <p class="card-subtitle">Digital55</p>
        <p class="card-description">
          Desarrollo de aplicaciones empresariales con Angular y Node.js.
        </p>
      </p-card>
    </div>
  </div>
</section>
