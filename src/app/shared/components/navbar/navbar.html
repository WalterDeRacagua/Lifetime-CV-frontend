<p-menubar [model]="items" styleClass="custom-menubar">
  <ng-template #start>
    <div class="brand">
      <span class="brand-text" routerLink="/home">Lifetime CV</span>
    </div>
  </ng-template>

  <ng-template #end>
    <button class="hamburger-btn" (click)="toggleMobileMenu()" [class.active]="mobileMenuOpen()">
      <i class="pi" [ngClass]="mobileMenuOpen() ? 'pi-times' : 'pi-bars'"></i>
    </button>

    <p-button label="Admin" icon="pi pi-lock" [outlined]="true" (onClick)="goToAdmin()"
      styleClass="admin-btn-desktop" />
  </ng-template>
</p-menubar>

@if (mobileMenuOpen()) {
<div class="mobile-menu" [@slideDown]>
  <div class="mobile-menu-grid">
    @for (item of items; track item.label) {
    <div class="mobile-menu-bubble" [routerLink]="item.routerLink" (click)="closeMobileMenu()"
      (keyup.enter)="closeMobileMenu()" (keyup.space)="closeMobileMenu()" tabindex="0" [pTooltip]="item.label"
      tooltipPosition="bottom">
      <i class="pi" [ngClass]="item.icon"></i>
    </div>
    }

    <div class="mobile-menu-bubble admin-bubble" (click)="goToAdmin(); closeMobileMenu()"
      (keyup.enter)="goToAdmin(); closeMobileMenu()" (keyup.space)="goToAdmin(); closeMobileMenu()" tabindex="0"
      pTooltip="Admin" tooltipPosition="bottom">
      <i class="pi pi-lock"></i>
    </div>
  </div>
</div>
}
